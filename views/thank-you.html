<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
</head>
<body>
  <h1>Thank you for your payment!</h1>
  <p id="payment-status">Loading payment status...</p>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe('pk_test_your_key');

    // Function to get the query parameter from the URL
    function getQueryParam(param) {
      const params = new URLSearchParams(window.location.search);
      return params.get(param);
    }

    // Extract the client_secret from the URL
    const clientSecret = getQueryParam('payment_intent_client_secret');

    if (clientSecret) {
      // Retrieve the Payment Intent using the client_secret
      stripe.retrievePaymentIntent(clientSecret).then(({ paymentIntent }) => {
        const paymentStatusElement = document.getElementById('payment-status');

        switch (paymentIntent.status) {
          case 'succeeded':
            paymentStatusElement.textContent = 'Payment succeeded!';
            break;
          case 'processing':
            paymentStatusElement.textContent = 'Payment processing. We\'ll update you once the payment is complete.';
            break;
          case 'requires_payment_method':
            paymentStatusElement.textContent = 'Payment failed. Please try again with a different payment method.';
            break;
          default:
            paymentStatusElement.textContent = 'Something went wrong with your payment. Please contact support.';
            break;
        }
      }).catch((error) => {
        console.error('Error retrieving payment intent:', error);
        document.getElementById('payment-status').textContent = 'Error retrieving payment status.';
      });
    } else {
      document.getElementById('payment-status').textContent = 'No payment information found.';
    }
  </script>
</body>
</html>
